<div class="page-heading">
  <div><h1>账号管理</h1><p class="page-desc">修改卖家登录密码；修改成功后旧会话立即失效。</p></div>
  
</div>

<div class="card" style="max-width:560px">
  <div class="card__header"><h2>修改密码</h2></div>
  <div class="card__body">
    <div class="field"><label>当前密码</label><input class="input" type="password" placeholder="请输入当前密码"></div>
    <div class="field"><label>新密码</label><input class="input" type="password" placeholder="8～128 位"></div>
    <div class="field"><label>确认新密码</label><input class="input" type="password" placeholder="再次输入新密码"></div>
    <button class="btn btn--primary" type="button">保存修改</button>
  </div>
</div>

<div class="alert alert--warning">
  <i class="alert__icon">!</i>
  <div>修改成功后当前登录状态失效，需要使用新密码重新登录；客户账号密码不受影响。</div>
</div>

<div class="card">
  <div class="card__header"><h2>账号信息</h2></div>
  <div class="card__body">
    <dl class="dl">
      <div><dt>卖家账号</dt><dd>admin</dd></div>
      <div><dt>初始密码</dt><dd>123456（仅首次建库有效）</dd></div>
      <div><dt>当前会话</dt><dd>已登录</dd></div>
    </dl>
  </div>
</div>

  </div>
</div>
