<main class="app-main">
  <div class="content-width">
<div class="seller-layout">
  <aside class="sidebar">
    <div class="sidebar__title">卖家后台</div>
    <a class="menu-item" href="12-卖家概览.html">概览</a><a class="menu-item" href="13-商品管理.html">商品管理</a><a class="menu-item" href="14-购买意向队列.html">购买意向</a><a class="menu-item" href="15-客户管理.html">客户管理</a><a class="menu-item is-active" href="16-分类管理.html">分类管理</a><a class="menu-item" href="18-账号管理.html">账号管理</a>

<div class="page-heading">
  <div><h1>分类管理</h1><p class="page-desc">维护两级商品分类，供商品发布与首页筛选使用。</p></div>
  
</div>

<div class="card">
  <div class="card__header"><h2>分类列表</h2><span class="muted small">一级 3 个 · 二级 4 个</span></div>
  <div class="card__body card__body--flush">
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th style="width:160px">一级分类</th><th>二级分类</th><th style="width:110px">商品数</th><th style="width:150px">操作</th></tr></thead>
        <tbody>
          <tr><td>木作</td><td>木牌</td><td class="num">1</td><td class="table__actions"><button class="btn btn--text" type="button">编辑</button><button class="btn btn--text" type="button">删除</button></td></tr>
          <tr><td></td><td><span class="muted">↳ </span>相框</td><td class="num">1</td><td class="table__actions"><button class="btn btn--text" type="button">编辑</button><button class="btn btn--text" type="button">删除</button></td></tr>
          <tr><td>编织</td><td>钥匙扣</td><td class="num">1</td><td class="table__actions"><button class="btn btn--text" type="button">编辑</button><button class="btn btn--text" type="button">删除</button></td></tr>
          <tr><td>陶瓷</td><td>书签</td><td class="num">1</td><td class="table__actions"><button class="btn btn--text" type="button">编辑</button><button class="btn btn--text" type="button">删除</button></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="card">
  <div class="card__header"><h2>新建分类</h2></div>
  <div class="card__body">
    <div class="form-grid">
      <div class="field"><label>分类名称</label><input class="input" placeholder="例如：木作"></div>
      <div class="field"><label>上级分类</label>
        <select class="select"><option>顶级分类</option><option>木作</option><option>编织</option><option>陶瓷</option></select>
      </div>
    </div>
    <button class="btn btn--primary" type="button">保存分类</button>
    <p class="field-hint">最多两级：选择顶级分类即创建一级分类，选择上级分类即创建其二级分类。</p>
  </div>
</div>

<div class="notice">删除分类前需要先移除或转移该分类下的商品；已被商品引用的分类不能直接删除。</div>

  </div>
</div>
  </div>
</main>
