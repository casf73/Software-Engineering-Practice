id : BIGINT</text><text x="598" y="707" class="field">FK product_id → products.id</text><text x="598" y="736" class="field"></text><text x="598" y="765" class="field">name / phone / status</text><text x="598" y="794" class="field">UK passcode : 有效时唯一，结束置空</text><text x="598" y="823" class="field"></text><text x="598" y="852" class="field"></text><text x="598" y="881" class="field">submitted_at / queue_at</text><rect x="40" y="600" width="400" height="155" rx="5" fill="#fff" stroke="#a7b4c4"/><text x="58" y="634" class="head">seller_accounts · 卖家凭据</text><path d="M40 649H440" stroke="#a7b4c4"/><text x="58" y="678" class="field">PK id : 固定 1</text><text x="58" y="707" class="field">password_hash : VARCHAR(256)</text><text x="58" y="736" class="field">session_version : BIGINT</text><path d="M580 230H440" class="edge" marker-end="url(#arrow)"/><path d="M760 600V420" class="edge" marker-end="url(#arrow)"/><path d="M230 120V98H465V214H440" class="edge" marker-end="url(#arrow)"/><text x="470" y="219" class="note">多 → 一</text><text x="776" y="510" class="note">多 → 一</text><text x="44" y="1000" class="note">每个商品独立排队和交易；每次成交库存减 1，售罄自动下架。</text><text x="44" y="1036" class="note">买家免注册，凭口令码查询及修改本人等待意向；A.2 已回退。</text><text x="44" y="1072" class="note">密码仅保存带随机盐的 PBKDF2 哈希，不通过业务接口返回。</text></svg>